<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CleanSky Air Quality Monitor</title>
  <desc id="desc">Real-time air quality intelligence and forecast platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021225" />
      <stop offset="100%" stop-color="#0b2f4d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78EAF8" />
      <stop offset="100%" stop-color="#89C6FF" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="960" cy="130" r="180" fill="#78EAF8" opacity="0.12" />
  <circle cx="1080" cy="560" r="260" fill="#89C6FF" opacity="0.1" />
  <rect x="80" y="96" width="154" height="10" rx="5" fill="url(#accent)" />
  <text x="80" y="192" fill="#E7F5FF" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700">CleanSky</text>
  <text x="80" y="255" fill="#B9D2E7" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="500">Air Quality Monitor</text>
  <text x="80" y="352" fill="#D9ECFF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400">Real-time AQI insights, trends, and forecasts</text>
  <text x="80" y="410" fill="#A8C2D8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">for city-level environmental intelligence.</text>
  <rect x="80" y="474" width="320" height="58" rx="29" fill="#0F2538" stroke="#2C5A78" />
  <text x="110" y="511" fill="#78EAF8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">cleansky-monitor</text>
</svg>
